#########################################################################################################
# TEST SETTINGS
#########################################################################################################

seed: 42

settings:
  "N": [30]           # Solo 1 valor
  N_t: [5]          # Solo Nt pequeño
  M: [0, 0.3]       # 2 valores de misspecification
  T_event: [0.5]    # Solo 1 timing
  R: 1              # Solo 2 réplicas

mcmc:
  chains: 2         # Reducir chains
  iter: 500         # Muy pocas iteraciones
  warmup: 250
  cores: 2

#########################################################################################################

output:
  results_dir: "results/"
  save_format: "sqlite"

model_params:
  phi0_scale: 0.7
  phi0_offdiag: 0.3
  mu0: [0, 0]
  ar0: [0.3, 0.3]
  ly00: 0.6
  random_intercept_var: 0.3

stan:
  model_file: "models/DSEM_VAR1_RI.stan"
  null_model_file: "models/DSEM_NULL.stan"
  params: ["ly", "sigmaeps", "sigmaeta1", "sigmaeta2", "ty", "ka", "beta1"]

