seed: 42

simulation:
  type: 2  # Only Simulation 2
  
settings:
  N: [30, 60, 90, 120, 150, 300]
  N_t: [5, 10, 15, 25, 50, 75]
  M: [0, 0.3, 0.6]  # Cross-loading magnitudes
  
  # T_event proportions based on N_t
  T_event: [0.25, 0.5, 0.75]
  # Replications (1 per core?) 355 cpus 64 cores per node
  R: 1 # 250  

  
  # Mapping T_event to N_t
  # For N_t=5: T_event at floor(5*proportion) = 1, 2, 3
  # For N_t=10: T_event at floor(10*proportion) = 2, 5, 7
  # For N_t=15: T_event at floor(15*proportion) = 3, 7, 11

model_params:
  phi0_scale: 0.7
  phi0_offdiag: 0.3
  mu0: [0, 0]
  ar0: [0.3, 0.3]
  ly00: 0.6
  random_intercept_var: 0.3

stan:
  model_file: "models/DSEM_VAR1_RI.stan"
  null_model_file: "models/DSEM_NULL.stan"
  params: ["ly", "sigmaeps", "sigmaeta1", "sigmaeta2", "ty", "ka", "beta1"]

mcmc:
  chains: 4
  iter: 2000
  warmup: 1000
  cores: 2


output:
  results_dir: "results/"
  save_format: "sqlite"



