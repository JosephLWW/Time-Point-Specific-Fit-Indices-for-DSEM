##########################################################################################################
# FULL SIMULATION SETTINGS
##########################################################################################################

seed: 42
overall_fits: False
  
settings:
  "N": [30, 60, 90, 120, 150, 300]
  N_t: [75] # 5, 10, 15, 25, 50, excluded to limit runtime
  M: [0, 0.3, 0.6]  # Cross-loading magnitudes
  T_event: [0.25, 0.5, 0.75]
  R: 200

  # Mapping T_event to N_t
  # For N_t=5: T_event at floor(5*proportion) = 2, 3, 4
  # For N_t=10: T_event at floor(10*proportion) = 3, 5, 7

mcmc:
  chains: 4
  iter: 2000
  warmup: 1000
  cores: 4

#########################################################################################################
# TEST SETTINGS
#########################################################################################################

# seed: 42
# overall_fits: FALSE

# settings:
#   "N": [30]           # Solo 1 valor
#   N_t: [5]          # Solo Nt pequeño
#   M: [0, 0.3]       # 2 valores de misspecification
#   T_event: [0.5]    # Solo 1 timing
#   R: 5              # Solo 2 réplicas

# mcmc:
#   chains: 2         # Reducir chains
